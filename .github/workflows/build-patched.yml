name: Build patched sui (linux/amd64)

on:
  push:
    branches: [ "fix/hysteria2-userid-stable" ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools gcc-multilib

      - name: Build sui binary (with all required tags)
        run: |
          BUILD_TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale,with_naive_outbound"
          CC=musl-gcc CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -linkmode external -extldflags '-static'" \
            -tags "$BUILD_TAGS" \
            -o sui-patched-linux-amd64 \
            .

      - name: Show binary info
        run: |
          ls -lh sui-patched-linux-amd64
          sha256sum sui-patched-linux-amd64
          file sui-patched-linux-amd64
          ./sui-patched-linux-amd64 -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sui-patched-linux-amd64
          path: sui-patched-linux-amd64
          retention-days: 7
